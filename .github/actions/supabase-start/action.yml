name: Start the local Supabase stack
description: >
  Installs the pinned CLI (./.github/actions/supabase-cli) and runs `supabase start` for the
  checkout (T88). The stack's Docker images come from the Actions cache when it has them, so the
  registry, whose 5xx used to fail this job, is usually not contacted at all. The cache key is
  the CLI version, supabase/config.toml, the excluded services, and the list of image ids the
  CLI pulled; a run whose list differs from what it restored saves a new entry (after a
  CLI bump, or the first run of all). Missing images are pulled with retries, and a failed start
  is stopped and retried with backoff (scripts/ci/supabase-start.sh), up to 5 attempts.

inputs:
  exclude:
    description: Services not to start, comma separated (`supabase start -x`).
    required: true

runs:
  using: composite
  steps:
    - id: cli
      uses: ./.github/actions/supabase-cli

    - id: key
      shell: bash
      env:
        CLI_VERSION: ${{ steps.cli.outputs.version }}
        CONFIG_HASH: ${{ hashFiles('supabase/config.toml') }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        inputs=$(printf '%s\n%s\n' "$CONFIG_HASH" "$EXCLUDE" | sha256sum | cut -c1-16)
        echo "prefix=supabase-images-v2-$RUNNER_OS-$RUNNER_ARCH-cli$CLI_VERSION-$inputs" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/supabase-images
        key: ${{ steps.key.outputs.prefix }}
        restore-keys: ${{ steps.key.outputs.prefix }}-

    - name: Load cached images
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/scripts/ci/supabase-images.sh" load ~/.cache/supabase-images
        echo "::notice::Supabase images loaded from the cache (${{ steps.restore.outputs.cache-matched-key }})."

    - name: supabase start
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        "$GITHUB_WORKSPACE/scripts/ci/retry.sh" "$GITHUB_WORKSPACE/scripts/ci/supabase-start.sh" "$EXCLUDE"

    - id: images
      name: Images to cache
      shell: bash
      env:
        PREFIX: ${{ steps.key.outputs.prefix }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        list="$RUNNER_TEMP/supabase-images.txt"
        "$GITHUB_WORKSPACE/scripts/ci/supabase-images.sh" list > "$list"
        cat "$list"
        key="$PREFIX-$(sha256sum < "$list" | cut -c1-16)"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        if [ "$key" = "$MATCHED" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
        else
          rm -rf ~/.cache/supabase-images
          "$GITHUB_WORKSPACE/scripts/ci/supabase-images.sh" save ~/.cache/supabase-images "$list"
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.images.outputs.save == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/supabase-images
        key: ${{ steps.images.outputs.key }}
