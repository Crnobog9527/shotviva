name: Detect code changes
description: >
  Sets `code` to 'false' when a pull request only touches docs and spec files (规范/, seo资料/,
  docs/, design/, *.md), so the calling job can skip its real work but still finish, quickly and
  green, under its required check name. Workflow-level paths-ignore would leave required checks
  pending forever. Pushes (main) and anything unexpected always get 'true'. The caller checks out
  with fetch-depth 2 so the PR merge commit's first parent (the base) is present.

outputs:
  code:
    description: "'true' when there is anything to build or test."
    value: ${{ steps.detect.outputs.code }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! files=$(git -c core.quotepath=off diff --name-only HEAD^1 HEAD); then
          echo "::warning::Could not list the PR's files; running everything."
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        code=$(printf '%s\n' "$files" | scripts/ci/has-code-changes.sh)
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = false ]; then
          echo "::notice::Docs/spec-only change; skipping build, tests and Supabase."
        fi
