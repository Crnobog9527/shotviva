name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Runs everything, Lighthouse included.
  workflow_dispatch:

# A new push to a PR cancels that PR's run in progress. Pushes to main are grouped per commit,
# so every merge gets a complete run and none is cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# "lint · typecheck · test · build" and "supabase db tests" are required checks on main, and
# "CI gate" sums up every job here (meant to become the one required check). A docs/spec-only PR
# or push to main (规范/, seo资料/, docs/, design/, *.md) still runs the required jobs, but each
# stops after the change detection step and reports success in seconds (.github/actions/changes).
#
# Lighthouse (mobile, marketing pages) runs on a PR only when it can measure something new: the
# pages' fingerprint (HTML, headers, static files they load, public/; scripts/ci/page-fingerprint.mjs)
# differs from the base commit's, or the change touches what the fingerprint cannot see
# (scripts/ci/lighthouse-force.sh). It measures the build the checks job made, in four parallel
# jobs, and an LCP just over its limit is measured once more (scripts/ci/lighthouse-run.sh).
#
# Server action ids are derived from this key; fixed in CI so two builds of the same code send the
# same bytes and the fingerprints compare. Not a secret: CI builds serve no one.
env:
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: c2hvdHZpdmEtY2ktZmluZ2VycHJpbnQta2V5LTAwMDE=

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      pages: ${{ steps.fingerprint.outputs.pages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # cache: pnpm restores the pnpm store keyed on pnpm-lock.yaml.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Next's build cache: main's runs save it, PRs start from main's latest (60 s → ~20 s locally).
      - if: steps.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: steps.changes.outputs.code == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.code == 'true'
        run: pnpm test
      - if: steps.changes.outputs.code == 'true'
        run: pnpm build
      # The app top bar must be in every app page's prerendered shell (scripts/app-shell-check-lib.ts).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm check:app-shell
      # First-load JS per route against scripts/js-budget.json (performance pass, B8).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm js:budget
      # The public pages' stylesheet has every class those pages use and stays under its budget
      # (scripts/public-css-check.ts).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm css:check
      # The SEO text of every indexable page must be in the server HTML (建站规格 R5): the
      # built app, fetched without JavaScript, checked against site/content.
      - name: SEO text is server-rendered
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
          pnpm seo:ssr http://localhost:3000
      # Home and landing pages' HTML, raw and gzip, against scripts/html-budget.json. This build has
      # no database, so profile "build" guards what does not come from the catalogue (styles,
      # messages, layout, copy); production's catalogue is checked daily (seo-check.yml).
      - name: HTML budget
        if: steps.changes.outputs.code == 'true'
        run: pnpm html:budget http://localhost:3000
      # What the Lighthouse pages send, compared with the base build's by the lighthouse jobs.
      # On any failure the output stays empty and Lighthouse runs.
      - name: Lighthouse pages fingerprint
        id: fingerprint
        if: steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: |
          if node scripts/ci/page-fingerprint.mjs http://localhost:3000 > "$RUNNER_TEMP/fingerprint.json"; then
            cat "$RUNNER_TEMP/fingerprint.json"
            echo "hash=$(jq -r .hash "$RUNNER_TEMP/fingerprint.json")" >> "$GITHUB_OUTPUT"
            echo "pages=$(jq -c .pages "$RUNNER_TEMP/fingerprint.json")" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not fingerprint the Lighthouse pages; Lighthouse will run."
          fi
      # The build the lighthouse jobs measure (no rebuild there), ~70 MB. .next/cache (only an
      # input to the next build) and source maps (not served) stay out.
      - if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        run: tar -cf - --exclude=./.next/cache --exclude='*.map' ./.next | gzip -1 > "$RUNNER_TEMP/next-build.tar.gz"
      - if: steps.changes.outputs.code == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build.tar.gz
          retention-days: 1
          compression-level: 0

  # The database stage (T88) is three jobs. "supabase schema" and the four "supabase db tests (k/4)"
  # shards each start their own local Supabase and run in parallel; "supabase db tests", the
  # required check, sums them up (scripts/ci/db-shards-verify.mjs). Each one decides on its own,
  # from the same commit, whether the change can affect the database or the DB tests
  # (scripts/ci/db-test-inputs.ts); when it cannot, they stop after change detection and the sum
  # reports success under the same required name, as before sharding.
  #
  # Schema check, kept apart from the tests so the snapshot comes from migrations only, never from
  # test data, and so the release dry run gets a database no test is writing to.
  db-schema:
    name: supabase schema
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.changes.outputs.db }}
      fix: ${{ steps.schema.outputs.fix }}
      tree: ${{ steps.schema.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      # Node 24 for scripts/ci/db-test-inputs.ts in the change detection.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: changes
        uses: ./.github/actions/changes
        with:
          db: 'true'
      - if: steps.changes.outputs.db == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.changes.outputs.db == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.db == 'true'
        run: pnpm install --frozen-lockfile
      # Pinned CLI and the stack's images from the Actions cache; downloads, pulls and the start
      # itself are retried with backoff (.github/actions/supabase-start). Only the services DB
      # tests need; later cards drop names from this list as they need them. The shards below
      # pass the same list, so all five jobs share one cache entry.
      - if: steps.changes.outputs.db == 'true'
        uses: ./.github/actions/supabase-start
        with:
          exclude: studio,imgproxy,edge-runtime,analytics,vector,inbucket,functions,realtime,storage
      - name: schema.sql matches migrations (export)
        if: steps.changes.outputs.db == 'true'
        run: pnpm db:schema
      # A stale file on a same-repo PR is not a failure: the schema-sql job below commits the
      # regenerated file to the branch (scripts/ci/schema-check.sh). The shards test the migrations,
      # never schema.sql (config.toml schema_paths = [], no DB test reads it), so their results
      # hold for that commit too; a test that reads supabase/schema.sql would break that carry.
      - name: schema.sql matches migrations
        id: schema
        if: steps.changes.outputs.db == 'true'
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FIX_DIR: ${{ runner.temp }}/schema-fix
        run: scripts/ci/schema-check.sh
      - if: steps.schema.outputs.fix == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-sql
          path: ${{ runner.temp }}/schema-fix/schema.sql
          retention-days: 3
      - if: steps.changes.outputs.db == 'true'
        run: pnpm exec vitest run --project pricing-release

  # The DB tests in four shards (vitest --shard splits the files), each on its own database and
  # serial within it, as `pnpm test:db` runs them. Every shard uploads a record of what it decided
  # and the JSON report of what it ran, even when it fails, for the sum below to check.
  db-shard:
    name: supabase db tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so one run shows every failing file.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: changes
        uses: ./.github/actions/changes
        with:
          db: 'true'
      - if: steps.changes.outputs.db == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.changes.outputs.db == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.db == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.db == 'true'
        uses: ./.github/actions/supabase-start
        with:
          exclude: studio,imgproxy,edge-runtime,analytics,vector,inbucket,functions,realtime,storage
      - if: steps.changes.outputs.db == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          REPORT: ${{ runner.temp }}/db-shard/report.json
        run: pnpm test:db --shard="$SHARD/4" --reporter=default --reporter=json --outputFile.json="$REPORT"
      - name: Record the shard
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          DB: ${{ steps.changes.outputs.db }}
          DIR: ${{ runner.temp }}/db-shard
        run: |
          mkdir -p "$DIR"
          printf '{"shard":%s,"of":4,"db":"%s","sha":"%s"}\n' "$SHARD" "$DB" "$GITHUB_SHA" > "$DIR/marker.json"
          cat "$DIR/marker.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/db-shard/
          retention-days: 30
          # A re-run of a failed shard replaces its record from the earlier attempt. Kept as long as
          # failed jobs can be re-run, since the sum reads the passed shards' records again.
          overwrite: true

  # The required check. Passes only when the schema job and every shard succeeded, all five made
  # the same run/skip decision, and, when the tests ran, the shards' reports together cover every
  # test file under tests/db exactly once with nothing failed (scripts/ci/db-shards-verify.mjs).
  # Runs even when a shard failed or the run was cancelled, so it is never skipped: a skipped
  # required check would count as passed.
  db:
    name: supabase db tests
    needs: [db-schema, db-shard]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      schema-fix: ${{ needs.db-schema.outputs.fix }}
      schema-tree: ${{ needs.db-schema.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts/ci
            tests/db
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: db-shard-*
          path: ${{ runner.temp }}/db-shards
      - env:
          SCHEMA_RESULT: ${{ needs.db-schema.result }}
          SHARDS_RESULT: ${{ needs.db-shard.result }}
          SCHEMA_DB: ${{ needs.db-schema.outputs.db }}
          SHARD_COUNT: '4'
          REPORT_DIR: ${{ runner.temp }}/db-shards
        run: node scripts/ci/db-shards-verify.mjs

  # The base commit's fingerprint, built here in parallel with the checks. Skipped when the change
  # forces Lighthouse anyway (scripts/ci/lighthouse-force.sh) or has no code.
  lighthouse-base:
    name: lighthouse baseline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      force: ${{ steps.force.outputs.force }}
      reason: ${{ steps.force.outputs.reason }}
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      pages: ${{ steps.fingerprint.outputs.pages }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      # Forced by the "run-lighthouse" label (read now, so a re-run after adding it counts), or by
      # a path the fingerprint cannot judge (scripts/ci/lighthouse-force.sh).
      - id: force
        if: steps.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels
        run: |
          if gh api "$LABELS_URL" --jq '.[].name' | grep -qx run-lighthouse; then
            force=true reason='label run-lighthouse'
          elif path=$(git -c core.quotepath=off diff --name-only HEAD^1 HEAD | scripts/ci/lighthouse-force.sh 2>&1 >/dev/null) && [ -n "$path" ]; then
            force=true reason="changed: $path"
          else
            force=false reason=''
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          [ "$force" = false ] || echo "::notice::Lighthouse runs whatever the fingerprint says ($reason)."
          # This PR's fingerprint script, used on the base checkout below.
          cp scripts/ci/page-fingerprint.mjs "$RUNNER_TEMP/"
      - if: steps.force.outputs.force == 'false'
        run: git checkout --quiet --detach HEAD^1
      - if: steps.force.outputs.force == 'false'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.force.outputs.force == 'false'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.force.outputs.force == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.force.outputs.force == 'false'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: steps.force.outputs.force == 'false'
        run: pnpm build
      - name: Base pages fingerprint
        id: fingerprint
        if: steps.force.outputs.force == 'false'
        env:
          FINGERPRINT_ROOT: ${{ github.workspace }}
        run: |
          pnpm start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
          node "$RUNNER_TEMP/page-fingerprint.mjs" http://localhost:3000 > "$RUNNER_TEMP/fingerprint.json"
          cat "$RUNNER_TEMP/fingerprint.json"
          echo "hash=$(jq -r .hash "$RUNNER_TEMP/fingerprint.json")" >> "$GITHUB_OUTPUT"
          echo "pages=$(jq -c .pages "$RUNNER_TEMP/fingerprint.json")" >> "$GITHUB_OUTPUT"

  # Mobile Lighthouse on the marketing pages of the checks job's build (performance pass, B8):
  # simulated throttling (lighthouserc.json: score ≥ 0.85, CLS ≤ 0.1; warns on LCP > 2.5 s and
  # TBT > 200 ms) and throttling in the browser for the Owner's mobile LCP standard
  # (lighthouserc.devtools.json: LCP ≤ 1.2 s on the median of 5 runs). The build has no
  # database, so template sections are empty: the numbers track regressions in our code, not
  # production. Pages are served through scripts/ci/lighthouse-server.mjs (HTTP/2 + brotli).
  lighthouse:
    name: lighthouse (${{ matrix.name }})
    needs: [checks, lighthouse-base]
    if: >-
      !cancelled() && github.event_name != 'push' &&
      needs.checks.result == 'success' && needs.checks.outputs.code == 'true' &&
      (needs.lighthouse-base.result != 'success' || needs.lighthouse-base.outputs.force != 'false' ||
       needs.checks.outputs.fingerprint == '' || needs.lighthouse-base.outputs.fingerprint == '' ||
       needs.checks.outputs.fingerprint != needs.lighthouse-base.outputs.fingerprint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'devtools /', config: lighthouserc.devtools.json, urls: '/' }
          - { name: 'devtools /zh', config: lighthouserc.devtools.json, urls: '/zh' }
          - { name: 'simulated en', config: lighthouserc.json, urls: '/ /pricing /image-to-image-generator' }
          - { name: 'simulated zh', config: lighthouserc.json, urls: '/zh /zh/pricing /commercial-photography' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/next-build.tar.gz"
      - env:
          URLS: ${{ matrix.urls }}
        run: |
          # shellcheck disable=SC2086 # URLS is a space-separated list
          scripts/ci/lighthouse-run.sh '${{ matrix.config }}' "$RUNNER_TEMP/lighthouse" $URLS
      - if: ${{ !cancelled() }}
        id: report-name
        env:
          NAME: ${{ matrix.name }}
        run: echo "name=lighthouse-reports-$(printf '%s' "$NAME" | tr -c 'a-z0-9' '-')" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.report-name.outputs.name }}
          path: ${{ runner.temp }}/lighthouse
          retention-days: 14

  # One check for the whole run, meant to be the only required one: passes when every job that
  # had to run passed, and counts a skipped job as passed when it was not needed (Lighthouse with
  # an unchanged fingerprint, everything on a docs-only change). The baseline is advisory: when it
  # fails, Lighthouse runs and decides.
  gate:
    name: CI gate
    needs: [checks, db, lighthouse-base, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - env:
          CHECKS: ${{ needs.checks.result }}
          DB: ${{ needs.db.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          BASE: ${{ needs.lighthouse-base.result }}
          CODE: ${{ needs.checks.outputs.code }}
          FORCE: ${{ needs.lighthouse-base.outputs.force }}
          REASON: ${{ needs.lighthouse-base.outputs.reason }}
          PAGES: ${{ needs.checks.outputs.pages }}
          BASE_PAGES: ${{ needs.lighthouse-base.outputs.pages }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/ci-gate.mjs

  # T88: commits the schema.sql the db job regenerated to the PR branch, once both required jobs
  # and the gate have finished, and posts their results on the new commit
  # (scripts/ci/schema-commit.sh). The only job with write access, and it installs and builds
  # nothing. Runs for same-repo PRs only (the db job prepares a fix for nothing else) and never
  # on top of its own commit.
  schema-sql:
    name: commit regenerated schema.sql
    needs: [checks, db, gate]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.db.outputs.schema-fix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    outputs:
      new-head: ${{ steps.commit.outputs.new-head }}
    steps:
      # All executable files in the write job come from main. The full fetch includes the
      # same-repo PR branch. Build its schema-only child using Git objects.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schema-sql
          path: ${{ runner.temp }}/schema-fix
      - name: Commit schema.sql and carry the results over
        id: commit
        env:
          FIX_FILE: ${{ runner.temp }}/schema-fix/schema.sql
          TREE: ${{ needs.db.outputs.schema-tree }}
          OLD_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          # Through env, never interpolated into the script: titles are untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DB_RESULT: ${{ needs.db.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/schema-commit.sh

  # The schema.sql commit above starts no workflow run, so nothing would post the required "Codex
  # findings" check on it. This job runs the same evaluation as codex-review.yml against the new
  # commit and posts its real result (scripts/ci/codex-findings-post.mjs): a review of the tested
  # commit holds there only through the schema-only carry rule, and open threads still fail it.
  # Scripts come from main; the token can read the PR and write check runs, nothing else.
  codex-findings:
    name: post Codex findings on the schema.sql commit
    needs: schema-sql
    # Drafts are skipped, as in codex-review.yml.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.schema-sql.result == 'success' && needs.schema-sql.outputs.new-head != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.schema-sql.outputs.new-head }}
          # schema-sql runs only for PRs that change the database, which review-risk.mjs rates high.
          RISK: high
          WAIT_MINUTES: '20'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/codex-findings-post.mjs
