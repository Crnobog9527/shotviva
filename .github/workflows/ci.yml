name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    name: supabase db tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - run: pnpm install --frozen-lockfile
      # Only the services DB tests need; later cards drop names from this list as they need them.
      - run: supabase start -x studio,imgproxy,edge-runtime,analytics,vector,inbucket,functions,realtime,storage
      - run: pnpm test:db
      # TEMPORARY (fix/ci-db-flake evidence, removed before merge)
      - name: HEAD vs GET probe through Kong
        if: always()
        run: ANON_KEY=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p') node scripts/ci-head-probe.mjs
      - name: Kong upstream errors
        if: always()
        run: docker logs supabase_kong_shotviva 2>&1 | grep -E 'upstream|\" 50[234] ' | cut -c1-300 | tail -40 || true
