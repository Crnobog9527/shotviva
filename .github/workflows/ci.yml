name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's run in progress. Pushes to main are grouped per commit,
# so every merge gets a complete run and none is cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Both job names are required checks on main. A docs/spec-only PR or push to main (规范/,
# seo资料/, docs/, design/, *.md) still runs both jobs, but each stops after the change detection
# step and reports success in seconds (.github/actions/changes). Every other step is gated on it.
jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v4
      # cache: pnpm restores the pnpm store keyed on pnpm-lock.yaml.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.code == 'true'
        run: pnpm test
      - if: steps.changes.outputs.code == 'true'
        run: pnpm build
      # The app top bar must be in every app page's prerendered shell (scripts/app-shell-check-lib.ts).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm check:app-shell
      # First-load JS per route against scripts/js-budget.json (performance pass, B8).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm js:budget
      # The SEO text of every indexable page must be in the server HTML (建站规格 R5): the
      # built app, fetched without JavaScript, checked against site/content.
      - name: SEO text is server-rendered
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm start > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
          pnpm seo:ssr http://localhost:3000

  # One local Supabase per run serves both the DB tests and the schema.sql snapshot check
  # (AGENTS §5), which used to start its own database in a separate workflow. T88: it runs only
  # when the change can affect the database or the DB tests (scripts/ci/db-test-inputs.ts);
  # otherwise it stops after change detection and reports success under the same required name.
  db:
    name: supabase db tests
    runs-on: ubuntu-latest
    outputs:
      schema-fix: ${{ steps.schema.outputs.fix }}
      schema-tree: ${{ steps.schema.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Node 24 for scripts/ci/db-test-inputs.ts in the change detection.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: changes
        uses: ./.github/actions/changes
        with:
          db: 'true'
      - if: steps.changes.outputs.db == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changes.outputs.db == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.db == 'true'
        run: pnpm install --frozen-lockfile
      # Pinned CLI and the stack's images from the Actions cache; downloads, pulls and the start
      # itself are retried with backoff (.github/actions/supabase-start). Only the services DB
      # tests need; later cards drop names from this list as they need them.
      - if: steps.changes.outputs.db == 'true'
        uses: ./.github/actions/supabase-start
        with:
          exclude: studio,imgproxy,edge-runtime,analytics,vector,inbucket,functions,realtime,storage
      # Before the tests, so the snapshot comes from migrations only, not from test data.
      - name: schema.sql matches migrations (export)
        if: steps.changes.outputs.db == 'true'
        run: pnpm db:schema
      # A stale file on a same-repo PR is not a failure: the tests run with the regenerated file
      # and the schema-sql job below commits it to the branch (scripts/ci/schema-check.sh).
      - name: schema.sql matches migrations
        id: schema
        if: steps.changes.outputs.db == 'true'
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FIX_DIR: ${{ runner.temp }}/schema-fix
        run: scripts/ci/schema-check.sh
      - if: steps.schema.outputs.fix == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: schema-sql
          path: ${{ runner.temp }}/schema-fix/schema.sql
          retention-days: 3
      - if: steps.changes.outputs.db == 'true'
        run: pnpm test:db

  # T88: commits the schema.sql the db job regenerated to the PR branch, once both required jobs
  # have finished, and posts their results on the new commit (scripts/ci/schema-commit.sh). The
  # only job with write access, and it installs and builds nothing. Runs for same-repo PRs only
  # (the db job prepares a fix for nothing else) and never on top of its own commit.
  schema-sql:
    name: commit regenerated schema.sql
    needs: [checks, db]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.db.outputs.schema-fix == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
      # All executable files in the write job come from main. The full fetch includes the
      # same-repo PR branch. Build its schema-only child using Git objects.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: schema-sql
          path: ${{ runner.temp }}/schema-fix
      - name: Commit schema.sql and carry the results over
        env:
          FIX_FILE: ${{ runner.temp }}/schema-fix/schema.sql
          TREE: ${{ needs.db.outputs.schema-tree }}
          OLD_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          # Through env, never interpolated into the script: titles are untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DB_RESULT: ${{ needs.db.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/schema-commit.sh
