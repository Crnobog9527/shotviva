name: Detect public page changes and notify IndexNow

on:
  pull_request:
    paths:
      - '.github/workflows/indexnow-auto.yml'
      - 'scripts/indexnow/**'
      - 'public/indexnow-key.txt'
  schedule:
    - cron: '13 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event_name == 'pull_request' && github.ref || 'production-snapshot' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check change detection
        run: python3 -m unittest discover -s scripts/indexnow -p 'test_*.py'

  notify:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow-state
          key: indexnow-content-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-content-v1-
      - name: Compare production content and notify changed pages
        run: python3 scripts/indexnow/auto.py
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow-state
          key: indexnow-content-v1-${{ github.run_id }}-${{ github.run_attempt }}
