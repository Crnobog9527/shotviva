# Daily drift check (AGENTS §5): the preview database must have applied exactly the
# migrations on main, no more and no fewer. A failure means a push failed, or something was
# applied outside the tooling; find out which before the next merge.
name: DB drift (preview)

on:
  schedule:
    # 03:17 UTC daily, off the top of the hour when scheduled runs queue up.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: db-drift-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    name: preview migrations match main
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/supabase-remote
        with:
          token-source: repository secret SUPABASE_ACCESS_TOKEN
          password-source: repository secret SUPABASE_PREVIEW_DB_PASSWORD
          ref-source: repository variable SUPABASE_PREVIEW_PROJECT_REF
      - run: scripts/check-migration-drift.sh --linked
