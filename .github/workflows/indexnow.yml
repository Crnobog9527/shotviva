name: Submit changed public URLs to IndexNow

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Changed production sitemap URLs, separated by spaces'
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Submit only published sitemap URLs
        env:
          CHANGED_URLS: ${{ inputs.urls }}
        run: |
          read -r -a urls <<< "$CHANGED_URLS"
          node scripts/indexnow.mjs "${urls[@]}"
