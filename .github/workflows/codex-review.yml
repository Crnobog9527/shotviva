name: Codex review

# Codex reviews in proportion to risk, and its findings block the merge until handled
# (scripts/ci/review-risk.mjs decides the risk from the changed paths).
#
# "Codex findings" (scripts/ci/codex-findings.mjs):
#   - fails while a Codex review thread is unresolved on current code. Fix: push the fix.
#     Won't fix: resolve the thread, then reply in it with the reason (the reply re-runs this).
#   - lists unresolved threads on lines a later commit changed as warnings, without failing;
#   - fails for high-risk PRs (money, sign-in, database, providers, proxy, config, CI) until a
#     Codex review has finished, and warns when the head is newer than the reviewed commit.
# Codex ignores "@codex review" from bots, so the review is asked for by a person or by the
# session that opened the PR (scripts/ci/codex-request.mjs, with the Owner's gh login).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  # Resolving a thread starts no workflow; a reply in the thread does (resolve, then reply with
  # what was done), and so does the push that fixes it.
  pull_request_review_comment:
    types: [created, edited, deleted]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  findings:
    name: Codex findings
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - id: risk
        env:
          GH_TOKEN: ${{ github.token }}
          URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100
        run: echo "risk=$(gh api --paginate "$URL" --jq '.[].filename' | node scripts/ci/review-risk.mjs)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RISK: ${{ steps.risk.outputs.risk }}
          # A new push starts a new run; a run started by a review or a resolved thread needs no wait.
          WAIT_MINUTES: ${{ github.event_name == 'pull_request' && '20' || '0' }}
        run: node scripts/ci/codex-findings.mjs
