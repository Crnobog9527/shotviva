# Merged migrations run automatically on main with the production environment. A manual
# migration run (pricing_operation none) uses production-manual, which has no reviewers since
# 2026-11-12, like the automatic run. Pricing data releases (activate / rollback) are money and
# keep an actual Owner review: they run in production-pricing, whose required reviewer is the
# Owner, and the job checks that approval itself. All three environments must restrict
# deployment branches to main. Other workflows on main can request an environment by name and
# are subject to its protection rules.
#
# Because the migration lands before the Vercel deployment is promoted, every migration must keep
# the code currently live on production working (expand, then contract). PRs that add a
# destructive migration fail "DB migrations expand-only" unless their title has `[contract]`
# (.github/workflows/db-migrations-expand-only.yml).
name: DB push (production)

on:
  workflow_dispatch:
    inputs:
      pricing_operation:
        description: approval-check runs no database steps; none applies migrations
        type: choice
        options: [approval-check, none, activate, rollback]
        default: approval-check
      release_sha:
        description: Exact reviewed main commit (required only for a pricing operation)
        type: string
        required: false
  # Also run whenever a merge to main adds or changes migrations.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  approval-check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (!inputs.pricing_operation || inputs.pricing_operation == 'approval-check')
    runs-on: ubuntu-latest
    # The environment that still has the Owner as reviewer: a dry check that approval works.
    environment: production-pricing
    permissions: {}
    steps:
      - run: echo 'Approval check completed.'

  push:
    concurrency:
      group: db-push-production
      cancel-in-progress: false
    name: supabase db push → production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || contains(fromJSON('["none","activate","rollback"]'), inputs.pricing_operation))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || (inputs.pricing_operation == 'none' && 'production-manual' || 'production-pricing') }}
    permissions:
      actions: read
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/supabase-remote
        with:
          token-source: environment secret SUPABASE_PRODUCTION_ACCESS_TOKEN
          password-source: production environment secret SUPABASE_PRODUCTION_DB_PASSWORD
          ref-source: production environment variable SUPABASE_PRODUCTION_PROJECT_REF
          # Pricing activate / rollback only; the approval must be on production-pricing.
          require-owner-review: ${{ github.event_name == 'workflow_dispatch' && inputs.pricing_operation != 'none' }}
          owner-review-environment: production-pricing
      - name: History before
        run: supabase migration list --linked
      # --include-all: cards own numbering ranges (TASKS), so a lower-numbered migration can
      # merge after a higher one. Versions on the database but not in the repo still abort.
      - name: Pending migrations
        if: github.event_name == 'push' || inputs.pricing_operation == 'none'
        run: supabase db push --include-all --dry-run
      - name: Apply
        if: github.event_name == 'push' || inputs.pricing_operation == 'none'
        run: supabase db push --include-all --yes
      - name: Verify history matches the repo
        run: scripts/check-migration-drift.sh --linked
      - name: Apply reviewed pricing data release
        if: github.event_name == 'workflow_dispatch' && inputs.pricing_operation != 'none'
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
          PRICING_V2_APPROVED_BASELINE: ${{ secrets.PRICING_V2_APPROVED_BASELINE }}
          OPERATION: ${{ inputs.pricing_operation }}
        run: |
          set -euo pipefail
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$SUPABASE_PROJECT_REF" = "irbqamjuazkkyvnnzupf"
          case "$OPERATION" in
            activate)
              umask 077
              file=$(mktemp)
              trap 'rm -f "$file"' EXIT
              python3 scripts/release/pricing-v2/render-production.py > "$file"
              # CLI/database diagnostics can include the rendered statement.
              supabase db query --linked --file "$file" >/dev/null 2>&1 || { echo "::error::Production activation failed"; exit 1; }
              exit 0
              ;;
            rollback) file=scripts/release/pricing-v2/production-rollback.sql ;;
            *) exit 1 ;;
          esac
          supabase db query --linked --file "$file"
