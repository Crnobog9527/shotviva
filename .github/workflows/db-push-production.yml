# Applies merged migrations to the production database. Runs from main, started automatically
# when a merge touches supabase/migrations/ (or by hand), with no approval step: review happens
# on the PR before it merges (AGENTS §5, Owner 2026-11-08). The run history of this workflow is
# the audit trail of what ran on production and when.
#
# Because the migration lands before the Vercel deployment is promoted, every migration must keep
# the code currently live on production working (expand, then contract). PRs that add a
# destructive migration fail "DB migrations expand-only" unless their title has `[contract]`
# (.github/workflows/db-migrations-expand-only.yml).
#
# The job is bound to the `production` environment. It no longer has a required reviewer; it
# holds the production password and project ref (not on the repository, so no other workflow can
# reach production) and its branch policy only lets runs from main use them. An environment that
# was never set up (no secrets) fails at "Check configuration" without touching the database.
name: DB push (production)

on:
  workflow_dispatch:
  # Also run whenever a merge to main adds or changes migrations.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: db-push-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push → production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-remote
        with:
          token-source: secret SUPABASE_ACCESS_TOKEN
          password-source: production environment secret SUPABASE_PRODUCTION_DB_PASSWORD
          ref-source: production environment variable SUPABASE_PRODUCTION_PROJECT_REF
      - name: History before
        run: supabase migration list --linked
      # --include-all: cards own numbering ranges (TASKS), so a lower-numbered migration can
      # merge after a higher one. Versions on the database but not in the repo still abort.
      - name: Pending migrations
        run: supabase db push --include-all --dry-run
      - name: Apply
        run: supabase db push --include-all --yes
      - name: Verify history matches the repo
        run: scripts/check-migration-drift.sh --linked
