# Applies merged migrations to the preview database (shotviva-preview). The only way
# migrations reach preview: nobody runs SQL there by hand (AGENTS §5). `supabase db push`
# refuses when the remote history has versions the repo lacks, so drift stops the push
# instead of being papered over.
name: DB push (preview)

# Only merges that change a migration; the daily drift check (db-drift.yml) still compares
# preview with main every day.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Rerun after fixing a failed push (e.g. secrets were missing).
  workflow_dispatch:
    inputs:
      pricing_operation:
        description: Optional reviewed pricing data release (ordinary pushes only install migrations)
        type: choice
        options: [none, activate, rollback]
        default: none
      release_sha:
        description: Exact reviewed main commit (required only for a pricing operation)
        type: string
        required: false

# One push at a time, never cancelled half-way.
concurrency:
  group: db-push-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push → preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/supabase-remote
        with:
          token-source: repository secret SUPABASE_ACCESS_TOKEN
          password-source: repository secret SUPABASE_PREVIEW_DB_PASSWORD
          ref-source: repository variable SUPABASE_PREVIEW_PROJECT_REF
      # --include-all: cards own numbering ranges (TASKS), so a lower-numbered migration can
      # merge after a higher one. Versions on the database but not in the repo still abort.
      - name: Pending migrations
        if: github.event_name == 'push' || inputs.pricing_operation == 'none'
        run: supabase db push --include-all --dry-run
      - name: Apply
        if: github.event_name == 'push' || inputs.pricing_operation == 'none'
        run: supabase db push --include-all --yes
      - name: Verify history matches the repo
        run: scripts/check-migration-drift.sh --linked
      - name: Apply reviewed pricing data release
        if: github.event_name == 'workflow_dispatch' && inputs.pricing_operation != 'none'
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
          OPERATION: ${{ inputs.pricing_operation }}
        run: |
          set -euo pipefail
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$SUPABASE_PROJECT_REF" = "pnzkiqvktkzznfbyhphe"
          case "$OPERATION" in
            activate) file=scripts/release/pricing-v2/preview.sql ;;
            rollback) file=scripts/release/pricing-v2/preview-rollback.sql ;;
            *) exit 1 ;;
          esac
          supabase db query --linked --file "$file"
