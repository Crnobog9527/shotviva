name: Lighthouse

# Performance pass, B8 (2026-11-07): mobile Lighthouse (the default Moto G Power profile, slow
# 4G, 4x CPU) on the marketing pages of a production build, median of 3 runs. Fails when the
# performance score drops under 0.85 or CLS goes over 0.1; warns on LCP > 2.5 s and TBT > 200 ms
# (lighthouserc.json). The build has no database, so template sections are empty: the numbers
# track regressions in our code, not production, which the control session measures separately.
# Signed-in app pages need a session and are measured on the test site instead.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: lighthouse (mobile, marketing pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: pnpm build
      - if: steps.changes.outputs.code == 'true'
        run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
