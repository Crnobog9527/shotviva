name: SEO indexing check

# ARCHITECTURE §12.0: production must stay out of search and AI indexes until launch. Once a
# day, check the live production address against the expected state and fail loudly if it
# drifted. The launch PR changes EXPECT from closed to open.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECT: closed
  # Production's project address; once shotviva.com is bound it 308s there and the check
  # follows. Override with the SEO_CHECK_URL repository variable if needed.
  SEO_CHECK_URL: ${{ vars.SEO_CHECK_URL || 'https://shotviva.vercel.app' }}

jobs:
  production-indexing:
    name: production indexing matches EXPECT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seo:check "$SEO_CHECK_URL" --expect="$EXPECT"
