<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex">
<title>Create · Shotviva</title>
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/studio.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/studio.js"></script>
<style>
  .top { padding: calc(var(--sat) + 8px) var(--gutter) 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .top h1 { font: 400 52px/.9 var(--font-display); letter-spacing: -0.03em; }
  .top .bal { margin-bottom: 4px; }
  .sub { padding: 8px var(--gutter) 0; font-size: 16px; color: var(--muted-foreground); }

  /* the feature: the same live pair as every card, wide plates from 768 up (4:3 each, the card ~8:3), portrait plates on the phone */
  .feature { position: relative; display: block; margin: 16px var(--gutter) 0; border-radius: 22px; overflow: hidden; text-align: left; width: calc(100% - 2 * var(--gutter));
    box-shadow: inset 0 0 0 1px var(--border); background: var(--card); }
  .feature .pair { border-radius: 22px; box-shadow: none; }
  .feature .pair .tag { top: 12px; bottom: auto; height: 28px; padding: 0 10px; } .feature .pair .tag.l { left: 12px; } .feature .pair .tag.r { right: 12px; }
  .feature .pair .badge-illus { top: 12px; left: calc(50% + 12px); bottom: auto; }
  .feature::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56%; pointer-events: none; z-index: 3;
    background: linear-gradient(180deg, color-mix(in srgb, var(--background) 0%, transparent), color-mix(in srgb, var(--background) 82%, transparent)); }
  .feature .f-meta { position: absolute; z-index: 4; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .feature .f-meta b { display: block; font: 400 32px/1 var(--font-display); letter-spacing: -0.02em; color: var(--foreground); }
  .feature .f-meta small { display: block; font-size: 14px; color: var(--bone-dim); margin-top: 4px; }
  /* the pill names the action (opens the creation panel); it is a quiet pill on the photo, not a second primary */
  .feature .f-go { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; font: 600 14px/1 var(--font-sans);
    background: var(--photo-scrim); color: var(--foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 18%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .feature .f-go .i { width: 16px; height: 16px; color: var(--primary); }
  @media (hover: hover) { .feature:hover { box-shadow: inset 0 0 0 1px var(--input); } }
  @media (max-width: 767px) { .feature .pair .badge-illus { left: auto; right: 12px; top: auto; bottom: 64px; } }   /* the right plate is too narrow for badge + AI tag */

  .chipbar { position: sticky; top: 0; z-index: 40; margin-top: 16px; padding: 8px 0;
    background: linear-gradient(color-mix(in srgb, var(--background) 94%, transparent), color-mix(in srgb, var(--background) 84%, transparent)); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  html.framed .chipbar.stuck { padding-top: calc(var(--sat) + 4px); }
  /* the grid: side-by-side pair cards (8:5), one per row on the phone; the art card is the tall one with the drag compare */
  .grid { list-style: none; margin: 8px 0 0; padding: 0 var(--gutter); display: grid; grid-template-columns: 1fr; gap: 24px 12px; grid-auto-flow: dense; }
  .grid li[hidden] { display: none; }
  .grid li.is-art .tpl { height: 100%; }
  .note { padding: 16px var(--gutter) 8px; font: 400 14px/1.4 var(--font-sans); color: var(--muted-foreground); }

  /* ======================= desktop ======================= */
  @media (min-width: 768px) {
    .top { padding-top: 32px; }
    .feature { margin-top: 24px; }
    .feature .pair { aspect-ratio: 8 / 3; }
    .feature .f-meta { left: 24px; right: 24px; bottom: 24px; }
    .chipbar { top: 56px; margin-top: 24px; }
    .chips { flex-wrap: wrap; overflow: visible; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 24px 16px; margin-top: 12px; }
    .grid li.is-art { grid-row: span 2; }
  }
  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body class="app">
<header class="top w">
  <h1>Create</h1>
  <a class="bal" href="paywall.html" aria-label="Balance: 6 free credits. Get credits"><span class="coin" aria-hidden="true"></span>6 free</a>
</header>
<div class="w">
<p class="sub">Pick a look. Your photo stays as shot.</p>

<button class="feature tpl pr" id="feature" type="button" data-open="evening-glow" aria-haspopup="dialog" aria-label="Evening Glow, video template, Rooms & stays. Make one">
  <span class="f-pair"></span>
  <span class="f-meta"><span><b>Evening Glow</b><small>Rooms &amp; stays · video</small></span><span class="f-go">Make one<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></span>
</button>
</div>

<div class="chipbar" id="chipbar">
  <div class="chips w" role="group" aria-label="Filter templates" id="chips"></div>
</div>
<main class="w">
  <h2 class="sr-only">Templates</h2>
  <ul class="grid" id="grid"></ul>
  <p class="note">Every card shows the phone photo on the left and the AI result on the right. Template images are illustrative examples.</p>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="create.html" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
  <a href="#wishlist"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>Wishlist</a>
  <a href="photos.html"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="14" height="14" rx="3"/><path d="M7 3.5h10.5a3 3 0 0 1 3 3V17"/><path d="M3.5 16l4-4 4 4 2-2 4 4"/></svg>Photos</a>
  <a href="account.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg>Account</a>
</nav>

<script>
(function () {
  const { T, CATS, pair, pairCard, createDialog, hoverPlay, reveal, bindCompare, q, frame } = window.SV;
  // feature card: the Evening Glow pair, wide plates (2400×900 stills, 1920×720 loop) from 768 up, the portrait set below
  const feat = document.getElementById('feature'), wideQ = matchMedia('(min-width: 768px)');
  const renderFeature = () => { const t = T.find(x => x.id === 'evening-glow'); feat.querySelector('.f-pair').innerHTML = pair({ ...t, id: wideQ.matches ? 'evening-glow-wide' : 'evening-glow' }, { live: true, video: true, badge: true }); };
  renderFeature(); wideQ.addEventListener('change', renderFeature);
  const chips = document.getElementById('chips'), grid = document.getElementById('grid');
  chips.innerHTML = [{ id: 'all', name: 'All' }, ...CATS].map((c, i) => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${i === 0}">${c.name}</button>`).join('');
  // category order (Art Styles first), so the one drag-compare card leads the grid
  const order = CATS.map(c => c.id);
  const list = [...T].sort((a, b) => order.indexOf(a.cat) - order.indexOf(b.cat));
  grid.innerHTML = list.map(t => `<li data-cat="${t.cat}" class="${t.cat === 'art' ? 'is-art' : ''}">${pairCard(t)}</li>`).join('');
  bindCompare(grid);
  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    grid.querySelectorAll('li').forEach(li => li.hidden = b.dataset.cat !== 'all' && li.dataset.cat !== b.dataset.cat);
    b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  });
  const bar = document.getElementById('chipbar');
  new IntersectionObserver(([e]) => bar.classList.toggle('stuck', e.intersectionRatio < 1), { threshold: 1, rootMargin: '-1px 0px 0px 0px' }).observe(bar);

  // a template click opens the creation dialog directly; Generate lands on the workspace page, developing
  const dlg = createDialog({ balance: q.has('balance') ? +q.get('balance') : 6, onGenerate: t => { location.href = `workspace.html?t=${t.id}&state=generating${frame()}`; } });
  document.addEventListener('click', e => { const c = e.target.closest('[data-open]'); if (c && !c.classList.contains('pr')) dlg.show(c.dataset.open); });
  const play = hoverPlay(document.querySelector('body'), { onOpen: id => dlg.show(id) });
  // the art card: a tap on the compare opens too (a drag still compares)
  grid.addEventListener('pointerdown', e => {
    const r = e.target.closest('.tpl.art input[type=range]'); if (!r) return;
    const x0 = e.clientX, t0 = performance.now(), v0 = r.value;
    r.addEventListener('pointerup', e2 => { if (Math.abs(e2.clientX - x0) < 6 && performance.now() - t0 < 300) { r.value = v0; r.dispatchEvent(new Event('input')); dlg.show(r.closest('.tpl').dataset.tpl); } }, { once: true });
  });

  reveal([document.querySelector('.feature'), ...grid.children]);

  // debug hooks for review captures: ?open=<id>[&state=ready] opens the dialog; ?hover=<id> freezes a card mid-wipe
  const open = q.get('open') || q.get('preview');
  if (open) setTimeout(() => dlg.show(open, q.get('state')), 300);
  if (q.get('hover')) setTimeout(() => { const c = document.querySelector(`.tpl.pr[data-open="${q.get('hover')}"]`); if (c) { c.classList.add('hover-debug'); play.start(c, false, 800); } }, 600);
})();
</script>
</body>
</html>
