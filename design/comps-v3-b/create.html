<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="robots" content="noindex">
<title>Create · Shotviva</title>
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/studio.css">
<script src="js/studio.js"></script>
<style>
  body { padding-bottom: calc(var(--sab) + 80px); }
  .top { padding: calc(var(--sat) + 8px) var(--gutter) 0; display: flex; align-items: flex-end; justify-content: space-between; }
  .top h1 { font: 400 52px/.9 var(--font-display); letter-spacing: -0.03em; }
  .bal { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; margin-bottom: 6px; position: relative;
    background: rgba(242,236,227,.06); box-shadow: inset 0 0 0 1px var(--border); font: 500 14px/1 var(--font-sans); text-decoration: none; }
  .bal::before { content: ""; position: absolute; inset: -4px 0; }
  .bal .coin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #FF8A63, var(--primary) 60%, #C93A14); color: var(--primary-foreground); font: 600 11px/1 var(--font-mono); }
  .sub { padding: 10px var(--gutter) 0; font-size: 16px; color: var(--muted-foreground); }

  .feature { position: relative; display: block; margin: 18px var(--gutter) 0; aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; text-align: left; width: calc(100% - 2 * var(--gutter));
    box-shadow: inset 0 0 0 1px var(--border); background: var(--card); }
  .feature video, .feature img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .feature::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,10,9,0) 40%, rgba(11,10,9,.85)); }
  .feature .f-meta { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .feature .f-meta b { display: block; font: 400 30px/1 var(--font-display); color: #fff; }
  .feature .f-meta small { display: block; font-size: 14px; color: rgba(255,255,255,.8); margin-top: 4px; }
  .feature .f-go { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; font: 600 14px/1 var(--font-sans); background: #fff; color: #0B0A09; }
  .feature .type { position: absolute; z-index: 2; top: 12px; left: 12px; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: rgba(11,10,9,.6); color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .feature .type .i { width: 13px; height: 13px; }
  .feature .type .fill { fill: currentColor; stroke: none; }
  .feature .badge-illus { top: 12px; left: auto; right: 12px; bottom: auto; }

  .chipbar { position: sticky; top: 0; z-index: 40; margin-top: 18px; padding: calc(var(--sat) * 0 + 10px) 0 10px;
    background: linear-gradient(rgba(11,10,9,.94), rgba(11,10,9,.84)); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  html.framed .chipbar.stuck { padding-top: calc(var(--sat) + 4px); }
  .grid { list-style: none; margin: 8px 0 0; padding: 0 var(--gutter); display: grid; grid-template-columns: 1fr 1fr; gap: 20px 12px; }
  .grid li[hidden] { display: none; }
  .note { padding: 18px var(--gutter) 10px; font: 400 14px/1.4 var(--font-sans); color: var(--muted-foreground); }
</style>
</head>
<body>
<header class="top">
  <h1>Create</h1>
  <a class="bal" href="paywall.html" aria-label="Balance: 6 free credits. Get credits"><span class="coin" aria-hidden="true">6</span>6 free</a>
</header>
<p class="sub">Pick a look. Your photo stays as shot.</p>

<button class="feature" type="button" data-tpl="evening-glow" aria-haspopup="dialog" aria-label="Evening Glow, video template, Rooms & stays. Preview">
  <video data-src="../assets/video/evening-glow.mp4" poster="../assets/img/evening-glow-split.webp" muted loop playsinline preload="none" aria-hidden="true"></video>
  <span class="type" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path class="fill" d="M8 5.5v13l11-6.5z"/></svg></span>
  <span class="badge-illus">Illustrative example</span>
  <span class="f-meta"><span><b>Evening Glow</b><small>Rooms &amp; stays · video</small></span><span class="f-go">Preview</span></span>
</button>

<div class="chipbar" id="chipbar">
  <div class="chips" role="group" aria-label="Filter templates" id="chips"></div>
</div>
<main>
  <h2 class="sr-only">Templates</h2>
  <ul class="grid" id="grid"></ul>
  <p class="note">Template images are illustrative examples.</p>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="create.html" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
  <a href="#wishlist"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>Wishlist</a>
  <a href="photos.html"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="14" height="14" rx="3"/><path d="M7 3.5h10.5a3 3 0 0 1 3 3V17"/><path d="M3.5 16l4-4 4 4 2-2 4 4"/></svg>Photos</a>
  <a href="#account"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg>Account</a>
</nav>

<script>
(function () {
  const { T, CATS, card, previewSheet } = window.SV;
  const chips = document.getElementById('chips'), grid = document.getElementById('grid');
  chips.innerHTML = [{ id: 'all', name: 'All' }, ...CATS].map((c, i) => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${i === 0}">${c.name}</button>`).join('');
  grid.innerHTML = T.map(t => `<li data-cat="${t.cat}">${card(t)}</li>`).join('');
  chips.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
    grid.querySelectorAll('li').forEach(li => li.hidden = b.dataset.cat !== 'all' && li.dataset.cat !== b.dataset.cat);
    b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  });
  const bar = document.getElementById('chipbar');
  new IntersectionObserver(([e]) => bar.classList.toggle('stuck', e.intersectionRatio < 1), { threshold: 1, rootMargin: '-1px 0px 0px 0px' }).observe(bar);
  const show = previewSheet(t => { location.href = 'workspace.html?t=' + t.id + (document.documentElement.classList.contains('framed') ? '&frame=1' : ''); });
  document.addEventListener('click', e => { const c = e.target.closest('[data-tpl]'); if (c) show(c.dataset.tpl); });
  if (window.SV.q.get('preview')) show(window.SV.q.get('preview'));
})();
</script>
</body>
</html>
